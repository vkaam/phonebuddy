name: Azure OIDC authorization smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to verify
        required: true
        type: choice
        options:
          - dev
          - test

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'vkaam/phonebuddy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify environment identity isolation
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          set -euo pipefail
          for environment in dev test; do
            if [[ "$environment" == dev ]]; then
              region=francecentral
            else
              region=belgiumcentral
            fi
            resource_group="rg-pb-${environment}-${region}-foundation"
            if [[ "$environment" == "$TARGET_ENVIRONMENT" ]]; then
              az group show --name "$resource_group" --query name --output tsv >/dev/null
            else
              if az group show --name "$resource_group" --query name --output tsv >/dev/null 2>"$RUNNER_TEMP/other-group-error"; then
                echo "The ${TARGET_ENVIRONMENT} identity can read the other environment."
                exit 1
              fi
              if ! grep -q AuthorizationFailed "$RUNNER_TEMP/other-group-error"; then
                echo "The other group check failed for a reason other than denied access."
                exit 1
              fi
            fi
          done
          if [[ "$TARGET_ENVIRONMENT" == dev ]]; then
            if az group show --name rg-pb-dev-belgiumcentral-foundation --query name --output tsv >/dev/null 2>"$RUNNER_TEMP/former-dev-group-error"; then
              echo "The dev identity can still read its former Belgium Central group."
              exit 1
            fi
            if ! grep -q AuthorizationFailed "$RUNNER_TEMP/former-dev-group-error"; then
              echo "The former dev group check failed for a reason other than denied access."
              exit 1
            fi
          fi
          echo "The ${TARGET_ENVIRONMENT} identity can read only its own approved foundation group."
