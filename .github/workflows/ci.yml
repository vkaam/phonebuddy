name: CI
run-name: CI ${{ github.sha }}

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Repository checks and policy regression tests
        run: |
          mkdir -p artifacts
          python3 scripts/quality.py 2>&1 | tee artifacts/quality.txt
          python3 -B scripts/run_required_unittests.py 2>&1 | tee artifacts/tests.txt
      - name: Validate this PR's issue, task and claim
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKLOG_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          python3 -B scripts/backlog_consistency.py --ci-pr --base origin/main \
            --branch "$BACKLOG_BRANCH" --output artifacts/backlog-consistency.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: '22.15.1'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ runner.arch }}-node-22.15.1-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Build and test web shell
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm audit 2>&1 | tee ../../artifacts/web-audit.txt
          npm run lint 2>&1 | tee ../../artifacts/web-lint.txt
          npm test
          npm run build
          npx playwright install --only-shell chromium
          npm run test:browser 2>&1 | tee ../../artifacts/web-browser.txt
      - name: Retain web build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/dist/
          retention-days: 14
      - name: Validate GitHub workflows
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color 2>&1 | tee artifacts/workflows.txt
      - name: Validate Bicep without Azure credentials
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/Azure/bicep/releases/download/v0.34.44/bicep-linux-x64 \
            -o "$RUNNER_TEMP/bicep"
          printf '%s  %s\n' dcc869edf53652303d4822b650d727419eeac33bce80cfb61f8ccc5cd2ccee47 "$RUNNER_TEMP/bicep" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bicep"
          BICEP="$RUNNER_TEMP/bicep" python3 -B scripts/check_bicep.py 2>&1 | tee artifacts/bicep.txt
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --report-format json --report-path artifacts/secrets.json .
      - name: Retain QA evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14

  backlog-audit:
    name: Backlog audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report repository-wide issue and task drift
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          python3 -B scripts/backlog_consistency.py --base origin/main \
            --branch main --output artifacts/backlog-consistency-audit.json
      - name: Highlight audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Repository-wide Backlog audit needs reconciliation; see retained JSON.'
      - name: Retain repository-wide audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backlog-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/backlog-consistency-audit.json
          retention-days: 14

  build-release-image:
    name: Build immutable release image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Image publication is not applicable outside main pushes
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo 'No release image is built for this event.'
      - name: Verify exact default-branch source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build and export the release image once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: phonebuddy-release-test:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --load \
            --tag "$IMAGE_TAG" \
            infra/release-test
          mkdir -p "$RUNNER_TEMP/release-image"
          docker save --output "$RUNNER_TEMP/release-image/release-test.tar" "$IMAGE_TAG"
          gzip -n "$RUNNER_TEMP/release-image/release-test.tar"
          (cd "$RUNNER_TEMP/release-image" && \
            sha256sum release-test.tar.gz > release-test.tar.gz.sha256)
          python3 - "$RUNNER_TEMP/release-image/manifest.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], 'w', encoding='utf-8') as manifest:
              json.dump({
                  'schema_version': 1,
                  'source_sha': os.environ['GITHUB_SHA'],
                  'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'image_tag': f"phonebuddy-release-test:{os.environ['GITHUB_SHA']}",
                  'image_archive': 'release-test.tar.gz',
              }, manifest, sort_keys=True)
              manifest.write('\n')
          PY
      - name: Retain immutable release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image/
          if-no-files-found: error
          retention-days: 14
