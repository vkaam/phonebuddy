name: PR safety

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  assess:
    name: Risk report (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Unassociated workflow runs cannot yield a PR recommendation.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0] != null
    steps:
      # SECURITY: execute only default-branch policy. Never check out the PR head,
      # run PR commands, download PR artifacts, or restore a PR-populated cache.
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Collect evidence and assess
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: python3 scripts/pr_safety.py --collect "$PR_NUMBER"
      - name: Retain decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr-safety.json
          retention-days: 14
